[tool.poetry]
name = "ELDAmwl"
version = "0.1.0"
description = "ELDA multi wavelengt SCC module"
authors = ["Ina Mattis <ina.mattis@dwd.de>"]

packages = [
    {include = "ELDAmwl"}
    ]

[tool.poetry.dependencies]
python = ">=3.9,<3.12"
addict = "2.4.0"
colorlog = "^4.2.1"
dynaconf = "^3.1.7"
isort = "^5.5.0"
joblib = "^1.1.0"
numpy = "^1.19.1"
netCDF4 = "^1.5.4"
objsize = "^0.3.3"
pandas ="^1.1.1"
pymysql = "^0.10.0"
PyYAML = "^6.0.0"
sqlalchemy = "^1.3.19"
SQLAlchemy-Utils = "^0.37.2"
scipy = "^1.5.2"
xarray = "^0.19.0"
"zope.interface" = "^5.4.0"
"zope.component" = "^5.0.1"
matplotlib = "^3.5.0"
h5netcdf = "^1.2.0"
plotly = "^5.17.0"
PyDynamic = "^2.4.2"

[tool.poetry.dev-dependencies]
autodocsumm = "^0.2.7"
coveralls = "^3.2.0"
pylint = "^2.13.9"
pytest = "^6.0.1"
pytest-mock = ">=3.7.0"
pytest-cov = ">=3.0.0"
sphinx = "^5.1.1"
sphinxcontrib-qthelp = "^1.0.3"
sphinxcontrib-serializinghtml = "^1.1.4"
sphinx-rtd-theme = "^1.1.1"
coverage = "^6.5.0"
rayleigh_fit = {path="../rayleigh_fit", develop=true}


[dependency-groups]
dev = [
    "autodocsumm<1.0.0,>=0.2.7",
    "coveralls<4.0.0,>=3.2.0",
    "pylint<3.0.0,>=2.13.9",
    "pytest<7.0.0,>=6.0.1",
    "pytest-mock>=3.7.0",
    "pytest-cov>=3.0.0",
    "sphinx<6.0.0,>=5.1.1",
    "sphinxcontrib-qthelp<2.0.0,>=1.0.3",
    "sphinxcontrib-serializinghtml<2.0.0,>=1.1.4",
    "sphinx-rtd-theme<2.0.0,>=1.1.1",
    "coverage<7.0.0,>=6.5.0",
]

[tool.pdm.build]
includes = ["ELDAmwl"]

[tool.uv.sources]
rayleigh-fit = { path = "../rayleigh_fit" }
[build-system]
requires = ["pdm-backend"]
build-backend = "pdm.backend"

[tool.poetry.scripts]
elda_mwl = "ELDAmwl.main:run"
elda_gen_test = "ELDAmwl.tests.fixtures:run"
elda_gen_sg_params = "ELDAmwl.storage.cached_functions:gen_sg_params"

[project]
authors = [
    {name = "Ina Mattis", email = "ina.mattis@dwd.de"},
]
requires-python = "<3.12,>=3.9"
dependencies = [
    "addict==2.4.0",
    "colorlog<5.0.0,>=4.2.1",
    "dynaconf<4.0.0,>=3.1.7",
    "isort<6.0.0,>=5.5.0",
    "joblib<2.0.0,>=1.1.0",
    "numpy<2.0.0,>=1.19.1",
    "netCDF4<2.0.0,>=1.5.4",
    "objsize<1.0.0,>=0.3.3",
    "pandas<2.0.0,>=1.1.1",
    "pymysql<1.0.0,>=0.10.0",
    "PyYAML<7.0.0,>=6.0.0",
    "sqlalchemy<2.0.0,>=1.3.19",
    "SQLAlchemy-Utils<1.0.0,>=0.37.2",
    "scipy<2.0.0,>=1.5.2",
    "xarray<1.0.0,>=0.19.0",
    "zope-interface<6.0.0,>=5.4.0",
    "zope-component<6.0.0,>=5.0.1",
    "matplotlib<4.0.0,>=3.5.0",
    "h5netcdf<2.0.0,>=1.2.0",
    "plotly<6.0.0,>=5.17.0",
    "PyDynamic<3.0.0,>=2.4.2",
    "memory-profiler>=0.61.0",
    "rayleigh-fit @ file:///home/ina/myprograms/python/rayleigh_fit#editable",
]
name = "ELDAmwl"
version = "0.1.0"
description = "ELDA multi wavelengt SCC module"

[project.scripts]
elda_mwl = "ELDAmwl.main:run"
elda_gen_test = "ELDAmwl.tests.fixtures:run"
elda_gen_sg_params = "ELDAmwl.storage.cached_functions:gen_sg_params"
